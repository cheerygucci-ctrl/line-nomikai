<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飲み会アンケート</title>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root {
    --bg: #FFF8F0;
    --card: #FFFFFF;
    --ink: #2B2118;
    --sub: #8A7B6E;
    --line: #EADFD3;
    --accent: #E8833A;
    --accent-ink: #FFFFFF;
    --chip: #FFF1E4;
    --err: #D64545;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
    font-size: 16px; line-height: 1.6;
    padding: 0 16px calc(32px + env(safe-area-inset-bottom));
  }
  .wrap { max-width: 480px; margin: 0 auto; }
  header { text-align: center; padding: 28px 0 8px; }
  header .emoji { font-size: 44px; line-height: 1; }
  header h1 { font-size: 22px; margin: 10px 0 4px; letter-spacing: .02em; }
  header p { margin: 0; color: var(--sub); font-size: 14px; }
  form { margin-top: 16px; }
  .q {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 12px;
  }
  .q label.t, .q .t { display: block; font-weight: 700; margin-bottom: 8px; }
  .req { display: inline-block; font-size: 11px; background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 0 6px; margin-left: 6px; vertical-align: 2px; font-weight: 700; }
  .opt { display: inline-block; font-size: 11px; color: var(--sub); margin-left: 6px; font-weight: 400; }
  .hint { font-size: 13px; color: var(--sub); margin: -4px 0 8px; }
  input[type=text], textarea {
    width: 100%; font: inherit; color: inherit; background: #FFFDFB;
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
    -webkit-appearance: none;
  }
  textarea { min-height: 88px; resize: vertical; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; border-color: transparent; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips input { position: absolute; opacity: 0; pointer-events: none; }
  .chips label {
    flex: 1 1 0; min-width: 84px; text-align: center; padding: 10px 8px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--chip); cursor: pointer; font-weight: 600; user-select: none;
  }
  .chips input:checked + label { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .chips input:focus-visible + label { outline: 2px solid var(--ink); }
  .q.error { border-color: var(--err); }
  .q .msg { display: none; color: var(--err); font-size: 13px; margin-top: 6px; }
  .q.error .msg { display: block; }
  .count { text-align: right; font-size: 12px; color: var(--sub); margin-top: 4px; }
  button.submit {
    width: 100%; margin-top: 8px; padding: 14px; font: inherit; font-weight: 700; font-size: 17px;
    background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px; cursor: pointer;
  }
  button.submit:disabled { opacity: .6; }
  .banner { display: none; background: #FDECEC; color: var(--err); border-radius: 12px; padding: 10px 12px; margin: 12px 0; font-size: 14px; }
  .banner.show { display: block; }
  .screen { display: none; text-align: center; padding: 64px 8px; }
  .screen.show { display: block; }
  .screen .emoji { font-size: 64px; }
  .screen h2 { margin: 12px 0 8px; }
  .screen p { color: var(--sub); }
  .ghost { margin-top: 20px; padding: 12px 28px; font: inherit; font-weight: 700; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); background: transparent; cursor: pointer; }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <div id="loading" class="screen show"><div class="spinner"></div><p>読み込み中…</p></div>

  <div id="main" hidden>
    <header>
      <div class="emoji">🍻</div>
      <h1>飲み会アンケート</h1>
      <p>1分で終わります。回答するとメニューが使えるようになります！</p>
    </header>

    <div id="banner" class="banner" role="alert"></div>

    <form id="form" novalidate>
      <div class="q" data-field="nickname">
        <label class="t" for="nickname">お名前（ニックネーム）<span class="req">必須</span></label>
        <input type="text" id="nickname" name="nickname" maxlength="30" autocomplete="nickname">
        <div class="msg">お名前を入れてください</div>
      </div>

      <div class="q" data-field="attend">
        <span class="t">参加しますか？<span class="req">必須</span></span>
        <div class="chips">
          <input type="radio" id="a1" name="attend" value="参加"><label for="a1">🙋 参加</label>
          <input type="radio" id="a2" name="attend" value="不参加"><label for="a2">🙇 不参加</label>
        </div>
        <div class="msg">どちらか選んでください</div>
      </div>

      <div class="q" data-field="drink">
        <span class="t">お酒は飲みますか？<span class="opt">任意</span></span>
        <div class="chips">
          <input type="radio" id="d1" name="drink" value="飲む"><label for="d1">🍺 飲む</label>
          <input type="radio" id="d2" name="drink" value="少し"><label for="d2">🥂 少し</label>
          <input type="radio" id="d3" name="drink" value="飲まない"><label for="d3">🧃 飲まない</label>
        </div>
      </div>

      <div class="q" data-field="ng">
        <label class="t" for="ng">食べられないもの・アレルギー<span class="opt">任意</span></label>
        <input type="text" id="ng" name="ng" maxlength="200" placeholder="例：えび、生もの">
      </div>

      <div class="q" data-field="dream">
        <label class="t" for="dream">将来の夢・やりたいこと<span class="opt">任意</span></label>
        <p class="hint">大きな夢でも、小さなやりたいことでもOK！</p>
        <textarea id="dream" name="dream" maxlength="1000" placeholder="例：いつか自分のカフェを開きたい"></textarea>
        <div class="count" data-for="dream"></div>
      </div>

      <div class="q" data-field="goal">
        <label class="t" for="goal">目標<span class="opt">任意</span></label>
        <p class="hint">今年や今月の目標など</p>
        <textarea id="goal" name="goal" maxlength="1000" placeholder="例：今年中にフルマラソン完走"></textarea>
        <div class="count" data-for="goal"></div>
      </div>

      <div class="q" data-field="comment">
        <label class="t" for="comment">ひとこと<span class="opt">任意</span></label>
        <textarea id="comment" name="comment" maxlength="500" placeholder="意気込みや質問などあればどうぞ"></textarea>
      </div>

      <button type="submit" class="submit" id="submit">回答を送信する</button>
    </form>
  </div>

  <div id="done" class="screen">
    <div class="emoji">🎉</div>
    <h2>回答ありがとうございます！</h2>
    <p>トークに戻ると、メニューが表示されています。<br>当日を楽しみにしています🍻</p>
    <button class="ghost" id="close">トークに戻る</button>
  </div>

  <div id="fatal" class="screen">
    <div class="emoji">🙏</div>
    <h2>うまく開けませんでした</h2>
    <p id="fatalMsg">LINEアプリからもう一度開いてください。</p>
  </div>
</div>

<script>
// ====== ここを書き換えてください ======
const LIFF_ID = '2012697224-lfwPcqYm';
const GAS_URL = 'https://script.google.com/macros/s/AKfycby45UwD6Ymwvnf_D_4vMbUGY_m0DUGJtse1oD3hqwHVuDASQ996Xnu2-AKLAqKheMiytQ/exec';
// =====================================

// ?preview=1 を付けると、LINEに接続せずに見た目だけ確認できます
const PREVIEW = new URLSearchParams(location.search).has('preview');
const FIELDS = ['nickname', 'attend', 'drink', 'ng', 'dream', 'goal', 'comment'];
const $ = (id) => document.getElementById(id);
const form = $('form');

function show(id) {
  ['loading', 'done', 'fatal'].forEach((s) => $(s).classList.toggle('show', s === id));
  $('main').hidden = id !== 'main';
}

function fatal(msg) {
  if (msg) $('fatalMsg').textContent = msg;
  show('fatal');
}

async function api(body) {
  if (PREVIEW) {
    await new Promise((r) => setTimeout(r, 600));
    return body.type === 'load' ? { ok: true, answer: null } : { ok: true };
  }
  const idToken = liff.getIDToken();
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORSの事前確認を避ける
    body: JSON.stringify({ ...body, idToken }),
  });
  return res.json();
}

function getValues() {
  const fd = new FormData(form);
  const out = {};
  FIELDS.forEach((k) => { out[k] = String(fd.get(k) || '').trim(); });
  return out;
}

function setValues(a) {
  FIELDS.forEach((k) => {
    const v = a[k] || '';
    const radios = form.querySelectorAll(`input[type=radio][name="${k}"]`);
    if (radios.length) radios.forEach((r) => { r.checked = r.value === v; });
    else if (form.elements[k]) form.elements[k].value = v;
  });
  updateCounts();
}

function validate(v) {
  const bad = [];
  if (!v.nickname) bad.push('nickname');
  if (!['参加', '不参加'].includes(v.attend)) bad.push('attend');
  document.querySelectorAll('.q').forEach((q) => q.classList.toggle('error', bad.includes(q.dataset.field)));
  return bad;
}

function updateCounts() {
  document.querySelectorAll('.count').forEach((c) => {
    const el = $(c.dataset.for);
    c.textContent = `${el.value.length} / ${el.maxLength}`;
  });
}

function banner(msg) {
  $('banner').textContent = msg || '';
  $('banner').classList.toggle('show', !!msg);
}

form.addEventListener('input', (e) => {
  updateCounts();
  const q = e.target.closest('.q');
  if (q && q.classList.contains('error')) validate(getValues());
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  banner('');
  const v = getValues();
  const bad = validate(v);
  if (bad.length) {
    document.querySelector(`.q[data-field="${bad[0]}"]`).scrollIntoView({ behavior: 'smooth', block: 'center' });
    return;
  }
  const btn = $('submit');
  const label = btn.textContent;
  btn.disabled = true;
  btn.textContent = '送信中…';
  try {
    const res = await api({ type: 'answer', answer: v });
    if (res.ok) { show('done'); window.scrollTo(0, 0); return; }
    if (res.error === 'auth') banner('ログインの有効期限が切れました。画面を閉じて、もう一度開いてください。');
    else if (res.error === 'invalid') { validate(v); banner('入力内容を確認してください。'); }
    else banner('回答は保存されましたが、メニューの表示に失敗しました。主催者に連絡してください。');
  } catch (err) {
    banner('通信に失敗しました。電波の良いところでもう一度送信してください。');
  } finally {
    btn.disabled = false;
    btn.textContent = label;
  }
});

$('close').addEventListener('click', () => {
  if (!PREVIEW && liff.isInClient()) liff.closeWindow();
  else show('main');
});

async function main() {
  updateCounts();
  if (PREVIEW) { show('main'); return; }
  try {
    await liff.init({ liffId: LIFF_ID });
  } catch (err) {
    return fatal('初期化に失敗しました。LINEアプリからもう一度開いてください。');
  }
  if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  try {
    const res = await api({ type: 'load' });
    if (res.ok && res.answer) {
      setValues(res.answer);
      $('submit').textContent = '回答を更新する';
    } else if (!res.ok && res.error === 'auth') {
      liff.logout(); liff.login({ redirectUri: location.href }); return;
    }
  } catch (err) { /* 読み込み失敗でも新規回答はできる */ }
  show('main');
}
main();
</script>
</body>
</html>
