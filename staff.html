<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>トラブル対応</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --ink: #1E2433; --sub: #6B7285; --line: #E3E6EE; --red: #D9362B; --amber: #E39B1B; --green: #2E9E6A; --navy: #1F2A44; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body { font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; color: var(--ink); background: #F4F5F9;
    padding: 0 0 calc(24px + env(safe-area-inset-bottom)); }
  header { background: var(--navy); color: #fff; padding: calc(14px + env(safe-area-inset-top)) 16px 16px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 900; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .8; }
  main { padding: 0 16px; max-width: 560px; margin: 0 auto; }
  h2 { font-size: 15px; margin: 22px 0 8px; color: var(--sub); }
  .call { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
  .call button { border: 0; border-radius: 16px; padding: 14px 10px; font: inherit; font-weight: 900; font-size: 15px; color: #fff; min-height: 64px; }
  .call .urgent { grid-column: span 2; background: var(--red); font-size: 19px; min-height: 72px; box-shadow: 0 4px 0 #9E1F16; }
  .call .trouble { background: var(--amber); box-shadow: 0 4px 0 #A86E0C; }
  .call .come { background: var(--navy); box-shadow: 0 4px 0 #0E1424; }
  .call button:active { transform: translateY(3px); box-shadow: none; }
  .place { width: 100%; margin-top: 8px; border: 2px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; font-size: 16px; background: #fff; }
  .search { position: sticky; top: 0; z-index: 2; background: #F4F5F9; padding: 8px 0; }
  .search input { width: 100%; border: 2px solid var(--line); border-radius: 12px; padding: 12px; font: inherit; font-size: 16px; background: #fff; }
  .chips { display: flex; gap: 6px; margin-top: 8px; overflow-x: auto; }
  .chips button { border: 2px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font: inherit; font-weight: 700; font-size: 13px; white-space: nowrap; color: var(--ink); }
  .chips button.on { background: var(--ink); border-color: var(--ink); color: #fff; }
  .g { background: #fff; border-radius: 16px; margin-top: 8px; border: 2px solid transparent; overflow: hidden; }
  .g.warn { border-color: var(--amber); }
  .g.ban { border-color: var(--red); background: #FFF4F2; }
  .g.focus { box-shadow: 0 0 0 4px rgba(217,54,43,.25); }
  .row { display: flex; align-items: center; gap: 10px; padding: 12px 14px; width: 100%; border: 0; background: none; font: inherit; text-align: left; color: inherit; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 17px; }
  .who span { font-size: 12px; color: var(--sub); }
  .pill { font-size: 12px; font-weight: 900; border-radius: 999px; padding: 4px 10px; white-space: nowrap; background: #EEF0F5; color: var(--sub); }
  .pill.in { background: #E3F5EC; color: var(--green); }
  .pill.flag-warn { background: #FFF1D6; color: #9A6406; }
  .pill.flag-ban, .pill.out { background: #FDE3E0; color: var(--red); }
  .more { padding: 0 14px 14px; display: none; }
  .g.open .more { display: block; }
  .memo { background: #F7F8FB; border-radius: 10px; padding: 10px; font-size: 13px; color: var(--ink); white-space: pre-wrap; margin-bottom: 8px; }
  .more textarea { width: 100%; border: 2px solid var(--line); border-radius: 10px; padding: 10px; font: inherit; font-size: 16px; min-height: 64px; resize: vertical; }
  .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .acts button { border: 0; border-radius: 12px; padding: 12px 8px; font: inherit; font-weight: 900; font-size: 14px; color: #fff; min-height: 48px; }
  .a-warn { background: var(--amber); } .a-leave { background: var(--navy); } .a-ban { background: var(--red); }
  .a-clear { background: #fff; color: var(--ink) !important; border: 2px solid var(--line) !important; }
  .a-note { grid-column: span 2; background: #fff; color: var(--ink) !important; border: 2px solid var(--line) !important; }
  button:disabled { opacity: .5; }
  .empty { text-align: center; color: var(--sub); padding: 24px 0; }
  .links { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .links a { display: block; background: #fff; border: 2px solid var(--line); border-radius: 12px; padding: 12px; text-align: center; color: var(--ink); text-decoration: none; font-weight: 900; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(120px); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 700; transition: transform .25s; z-index: 9; max-width: calc(100% - 32px); }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: none; align-items: flex-end; z-index: 8; }
  .sheet.show { display: flex; }
  .sheet > div { background: #fff; width: 100%; border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); }
  .sheet h3 { margin: 0 0 6px; font-size: 18px; }
  .sheet p { margin: 0 0 14px; color: var(--sub); white-space: pre-wrap; }
  .sheet .btns { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
  .sheet button { border: 0; border-radius: 12px; padding: 14px; font: inherit; font-weight: 900; font-size: 16px; }
  .sheet .no { background: #EEF0F5; } .sheet .yes { background: var(--red); color: #fff; }
  .err { color: var(--red); font-weight: 700; text-align: center; margin-top: 16px; }
</style>
</head>
<body>
<header>
  <h1>🛡 トラブル対応</h1>
  <p id="hello">主催者・受付スタッフだけが使えるページです</p>
</header>
<main>
  <h2>スタッフを呼ぶ（ほかのスタッフのLINEに届きます）</h2>
  <div class="call">
    <button class="urgent" data-kind="urgent">🚨 至急！すぐ来て</button>
    <button class="trouble" data-kind="trouble">⚠️ 困った人がいる</button>
    <button class="come" data-kind="come">🙋 手を貸して</button>
  </div>
  <input class="place" id="place" maxlength="100" placeholder="場所・状況（任意）例：入口、奥のテーブル">

  <h2>今日の参加者 <span id="count"></span></h2>
  <div class="search">
    <input id="q" type="search" placeholder="名前で探す">
    <div class="chips" id="chips">
      <button data-f="all" class="on">すべて</button>
      <button data-f="in">受付済み</button>
      <button data-f="flag">⚠️ 要注意・出禁</button>
      <button data-f="out">退場</button>
    </div>
  </div>
  <div id="list"><p class="empty">読み込み中…</p></div>
  <p class="err" id="err"></p>

  <h2>ほかの操作</h2>
  <div class="links">
    <a href="https://line.me/R/nv/QRCodeReader">📷 QRで受付</a>
    <a id="admin" href="#">🖥 管理者サイト</a>
  </div>
</main>
<div class="sheet" id="sheet"><div><h3 id="sTitle"></h3><p id="sBody"></p><div class="btns"><button class="no" id="sNo">やめる</button><button class="yes" id="sYes">OK</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const LIFF_ID = '2012697224-lfwPcqYm';
const GAS_URL = 'https://script.google.com/macros/s/AKfycby45UwD6Ymwvnf_D_4vMbUGY_m0DUGJtse1oD3hqwHVuDASQ996Xnu2-AKLAqKheMiytQ/exec';
const ADMIN_URL = 'https://script.google.com/macros/s/AKfycbwPXMvPakMdCljBulMg0I7vnNTqTgSE3EvaV5VeKBWTcx6Q_E9No3UfLSuTM9cAdRiP/exec';
const params = new URLSearchParams(location.search);
const PREVIEW = params.has('preview');
const $ = (id) => document.getElementById(id);
$('admin').href = ADMIN_URL + '?openExternalBrowser=1';
let guests = [];
let filter = 'all';
let openCode = params.get('c') || '';

function el(tag, props, kids) {
  const e = Object.assign(document.createElement(tag), props || {});
  (kids || []).forEach((k) => { if (k) e.append(k); });
  return e;
}
function toast(t) { const x = $('toast'); x.textContent = t; x.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => x.classList.remove('show'), 2600); }
function confirmSheet(title, body, yes) {
  return new Promise((res) => {
    $('sTitle').textContent = title; $('sBody').textContent = body; $('sYes').textContent = yes;
    $('sheet').classList.add('show');
    const done = (v) => { $('sheet').classList.remove('show'); $('sYes').onclick = $('sNo').onclick = null; res(v); };
    $('sYes').onclick = () => done(true); $('sNo').onclick = () => done(false);
  });
}

// ---- プレビュー用のダミー ----
const DEMO = [
  { code: 'aaaaaa111111', nickname: 'ありす', lineName: 'Alice', status: '承認', checkedIn: '19:05', flag: '', memo: '' },
  { code: 'bbbbbb222222', nickname: 'たける', lineName: 'Takeru', status: '承認', checkedIn: '19:12', flag: '要注意', memo: '11/20 20:10 ぐっち：しつこく連絡先を聞いていた' },
  { code: 'cccccc333333', nickname: 'みお', lineName: 'Mio', status: '承認', checkedIn: '', flag: '', memo: '' },
  { code: 'dddddd444444', nickname: 'けん', lineName: 'Ken', status: '申請中', checkedIn: '', flag: '', memo: '' },
];
async function api(body) {
  if (PREVIEW) {
    await new Promise((r) => setTimeout(r, 300));
    if (body.op === 'list') return { ok: true, me: 'ぐっち', staffCount: 2, guests: DEMO };
    if (body.op === 'alert') return { ok: true, sent: 1 };
    const g = DEMO.find((x) => x.code === body.code);
    if (body.op === 'warn') g.flag = '要注意'; if (body.op === 'ban') g.flag = '出禁'; if (body.op === 'clear') g.flag = '';
    if (body.op === 'leave') { g.status = '退場'; g.flag = g.flag || '要注意'; }
    if (body.note) g.memo = (g.memo ? g.memo + ' / ' : '') + 'いま ぐっち：' + body.note;
    return { ok: true, guest: { ...g } };
  }
  const r = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ type: 'staff', idToken: liff.getIDToken(), ...body }) });
  return r.json();
}

// ---- スタッフ呼び出し ----
document.querySelectorAll('.call button').forEach((b) => b.addEventListener('click', async () => {
  const label = b.textContent;
  const place = $('place').value.trim();
  const ok = await confirmSheet(label, 'ほかのスタッフ全員のLINEに通知します。' + (place ? '\n📍 ' + place : ''), '呼ぶ');
  if (!ok) return;
  b.disabled = true;
  try {
    const res = await api({ op: 'alert', kind: b.dataset.kind, note: place });
    if (!res.ok) throw new Error(res.error);
    toast(res.sent ? '📣 ' + res.sent + '人に知らせました' : 'ほかに登録しているスタッフがいません');
    if (navigator.vibrate) navigator.vibrate(60);
  } catch (e) { toast('送れませんでした。もう一度押してね'); }
  b.disabled = false;
}));

// ---- 参加者リスト ----
const STATUS = (g) => g.status === '退場' ? ['退場', 'out'] : g.checkedIn ? ['受付 ' + g.checkedIn, 'in'] : g.status === '申請中' ? ['承認待ち', ''] : ['未受付', ''];
const FLAG = { '要注意': ['⚠️ 要注意', 'flag-warn', 'warn'], '出禁': ['🚫 出禁', 'flag-ban', 'ban'] };

function card(g) {
  const st = STATUS(g);
  const f = FLAG[g.flag];
  const note = el('textarea', { placeholder: '何があった？（任意・ほかのスタッフにも届きます）', maxLength: 150 });
  const act = (op, text, cls, ask) => {
    const b = el('button', { className: cls, textContent: text });
    b.addEventListener('click', async () => {
      const v = note.value.trim();
      if (op === 'note' && !v) { note.focus(); toast('メモを書いてね'); return; }
      if (ask && !(await confirmSheet(ask[0], ask[1], ask[2]))) return;
      b.disabled = true;
      try {
        const res = await api({ op, code: g.code, note: v });
        if (!res.ok) throw new Error(res.error);
        Object.assign(g, res.guest);
        openCode = g.code;
        render();
        toast({ warn: '⚠️ 要注意にしました', ban: '🚫 出禁にしました', clear: '↩️ 外しました', leave: '🚪 退場にしました', note: '📝 メモしました' }[op]);
      } catch (e) { b.disabled = false; toast('保存できませんでした。もう一度押してね'); }
    });
    return b;
  };
  const box = el('div', { className: 'g' + (f ? ' ' + f[2] : '') + (openCode === g.code ? ' open focus' : '') }, [
    el('button', { className: 'row', onclick: () => { box.classList.toggle('open'); openCode = box.classList.contains('open') ? g.code : ''; } }, [
      el('div', { className: 'who' }, [el('b', { textContent: g.nickname + ' さん' }), el('span', { textContent: 'LINE名：' + g.lineName })]),
      f ? el('span', { className: 'pill ' + f[1], textContent: f[0] }) : null,
      el('span', { className: 'pill ' + st[1], textContent: st[0] }),
    ]),
    el('div', { className: 'more' }, [
      g.memo ? el('div', { className: 'memo', textContent: '📝 ' + g.memo }) : null,
      note,
      el('div', { className: 'acts' }, [
        g.flag !== '要注意' ? act('warn', '⚠️ 要注意', 'a-warn', null) : act('clear', '↩️ 要注意を外す', 'a-clear', null),
        g.status !== '退場' ? act('leave', '🚪 退場してもらった', 'a-leave', ['退場にしますか？', g.nickname + ' さんを「退場」にして、ほかのスタッフに知らせます。\n本人には通知されません。', '退場にする']) : null,
        g.flag !== '出禁' ? act('ban', '🚫 出禁', 'a-ban', ['出禁にしますか？', g.nickname + ' さんは次回から予約できなくなります。\n本人には通知されません。あとで管理者サイトから外せます。', '出禁にする']) : act('clear', '↩️ 出禁を外す', 'a-clear', ['出禁を外しますか？', 'また予約できるようになります。', '外す']),
        act('note', '📝 メモだけ残す', 'a-note', null),
      ]),
    ]),
  ]);
  return box;
}

function render() {
  const q = $('q').value.trim().toLowerCase();
  const list = guests.filter((g) => (!q || (g.nickname + g.lineName).toLowerCase().includes(q))
    && (filter === 'all' || (filter === 'in' ? g.checkedIn && g.status !== '退場' : filter === 'flag' ? g.flag : g.status === '退場')));
  // 開いている人 → 要注意・出禁 → 受付済み → その他
  const rank = (g) => (g.code === openCode ? 0 : g.flag === '出禁' ? 1 : g.flag ? 2 : g.checkedIn ? 3 : 4);
  list.sort((a, b) => rank(a) - rank(b) || a.nickname.localeCompare(b.nickname, 'ja'));
  const inCount = guests.filter((g) => g.checkedIn && g.status !== '退場').length;
  $('count').textContent = '（受付 ' + inCount + ' / ' + guests.length + '人）';
  $('list').replaceChildren(...(list.length ? list.map(card) : [el('p', { className: 'empty', textContent: guests.length ? '見つかりません' : 'まだ予約した人がいません' })]));
}
$('q').addEventListener('input', render);
$('chips').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  filter = b.dataset.f;
  document.querySelectorAll('#chips button').forEach((x) => x.classList.toggle('on', x === b));
  render();
});

function loadSdk() {
  if (window.liff) return Promise.resolve();
  return new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js'; sc.charset = 'utf-8';
    sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
    setTimeout(() => rej(new Error('timeout')), 15000);
  });
}

async function load() {
  const res = await api({ op: 'list' });
  if (!res.ok) {
    const msg = { not_staff: 'このLINEはスタッフ登録されていません。管理者サイトのメンバータブの番号で「通知登録」か「受付登録」をしてね。', auth: 'ログインし直してね。' }[res.error] || '読み込めませんでした。';
    $('list').replaceChildren(); $('err').textContent = msg;
    document.querySelectorAll('.call button').forEach((b) => { b.disabled = true; });
    return;
  }
  $('hello').textContent = res.me + ' さん・スタッフ ' + res.staffCount + '人';
  guests = res.guests;
  render();
  if (openCode) { const f = document.querySelector('.g.focus'); if (f) f.scrollIntoView({ block: 'center' }); }
}

async function main() {
  if (!PREVIEW) {
    try { await loadSdk(); await liff.init({ liffId: LIFF_ID }); } catch (e) { $('list').replaceChildren(); $('err').textContent = 'LINEアプリから開いてね。'; return; }
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  }
  try { await load(); } catch (e) { $('list').replaceChildren(); $('err').textContent = '通信エラー。電波のいいところで開き直してね。'; }
}
// 別のスタッフの操作も見えるように、画面に戻ったら読み直す
document.addEventListener('visibilitychange', () => { if (!document.hidden && guests.length) load().catch(() => {}); });
main();
</script>
</body>
</html>
