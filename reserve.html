<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>イベントの予約</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<script src="nomy.js"></script>
<style>
  :root { --beer: #F6B93B; --lantern: #E4572E; --ink: #2A1C0C; --sub: #8A7B6E; --paper: #FFFDF6; --ok: #2E9E6A; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body { background: linear-gradient(#FFE29A, #F6B04B); color: var(--ink); font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    padding: calc(14px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  main { max-width: 440px; margin: 0 auto; }
  .head { display: flex; align-items: center; gap: 10px; }
  .head .nomy-box { width: 96px; flex-shrink: 0; }
  .say { background: #fff; border-radius: 18px; padding: 10px 14px; font-weight: 900; position: relative; box-shadow: 0 4px 0 rgba(0,0,0,.08); }
  .say::before { content: ""; position: absolute; left: -10px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-right: 10px solid #fff; border-left: 0; }
  .say.pop { animation: pop .35s ease; }
  @keyframes pop { 50% { transform: scale(1.06); } }
  .card { background: var(--paper); border-radius: 22px; padding: 18px; margin-top: 14px; box-shadow: 0 6px 0 rgba(0,0,0,.08); }
  .ticket { position: relative; border: 3px dashed #E9C77B; border-radius: 16px; padding: 14px 16px; background: #FFF6DE; }
  .ticket h2 { margin: 0 0 8px; font-size: 20px; }
  .ticket dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 12px; font-size: 15px; }
  .ticket dt { color: var(--sub); font-size: 13px; padding-top: 2px; }
  .ticket dd { margin: 0; font-weight: 700; white-space: pre-wrap; word-break: break-word; }
  .stamp { position: absolute; right: 10px; top: -14px; transform: rotate(10deg); border: 3px solid currentColor; border-radius: 10px; padding: 2px 10px; font-weight: 900; font-size: 16px; background: #fff; }
  .stamp.wait { color: #B07A00; } .stamp.ok { color: var(--ok); animation: stampIn .5s cubic-bezier(.3,1.6,.5,1); } .stamp.no { color: var(--sub); }
  @keyframes stampIn { from { transform: rotate(10deg) scale(2.2); opacity: 0; } }
  label.l { display: block; font-weight: 900; margin: 16px 0 6px; }
  textarea { width: 100%; min-height: 76px; border: 2px solid #E6D9B8; border-radius: 14px; padding: 10px 12px; font: inherit; font-size: 16px; resize: vertical; background: #fff; }
  textarea:focus { outline: none; border-color: var(--beer); }
  .btn { display: block; width: 100%; margin-top: 16px; border: 0; border-radius: 999px; padding: 16px; font: inherit; font-weight: 900; font-size: 18px; background: var(--lantern); color: #fff; box-shadow: 0 5px 0 #A93A18; cursor: pointer; text-align: center; text-decoration: none; }
  .btn:active { transform: translateY(3px); box-shadow: 0 2px 0 #A93A18; }
  .btn:disabled { opacity: .6; }
  .btn.sub { background: transparent; color: var(--sub); box-shadow: none; border: 2px solid #E6D9B8; font-size: 15px; padding: 11px; margin-top: 10px; }
  .btn.beer { background: var(--beer); color: var(--ink); box-shadow: 0 5px 0 #B8820F; }
  .note { font-size: 13px; color: var(--sub); line-height: 1.6; margin: 10px 0 0; }
  .msg { font-weight: 900; font-size: 18px; text-align: center; margin: 4px 0 0; line-height: 1.5; }
  .steps { display: grid; grid-template-columns: 1fr auto 1fr auto 1fr; align-items: center; gap: 4px; margin: 4px 0 14px; font-size: 12px; font-weight: 900; text-align: center; color: var(--sub); }
  .steps span.on { color: var(--lantern); }
  .steps span.done { color: var(--ok); }
  .steps i { font-style: normal; }
  .err { color: #C0392B; font-weight: 700; margin-top: 10px; }
  .modal { position: fixed; inset: 0; background: rgba(42,28,12,.55); display: none; align-items: flex-end; justify-content: center; z-index: 20; padding: 16px; }
  .modal.on { display: flex; animation: fade .2s ease; }
  .sheet { background: #fff; border-radius: 24px; width: 100%; max-width: 440px; padding: 20px 18px calc(18px + env(safe-area-inset-bottom)); animation: up .3s cubic-bezier(.2,.9,.3,1.1); }
  @keyframes fade { from { opacity: 0; } } @keyframes up { from { transform: translateY(40px); opacity: 0; } }
  .sheet h3 { margin: 0 0 6px; font-size: 19px; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 30; }
  .confetti i { position: absolute; top: -20px; left: var(--x); width: 9px; height: 14px; background: var(--c); border-radius: 2px; animation: fall var(--d) linear var(--delay) forwards; }
  @keyframes fall { to { transform: translate(var(--drift), 110vh) rotate(var(--r)); } }
  .qrbox { text-align: center; margin: 14px 0 4px; }
  .qrbox #qr { display: inline-block; background: #fff; padding: 12px; border-radius: 16px; border: 3px solid var(--beer); }
  .qrbox #qr img, .qrbox #qr canvas { display: block; width: 200px; height: 200px; }
  .qrbox p { margin: 8px 0 0; font-weight: 900; }
  .badge { display: inline-block; background: var(--ink); color: #fff; border-radius: 999px; padding: 4px 14px; font-weight: 900; font-size: 14px; margin-top: 10px; }
  [hidden] { display: none !important; }
  @media (prefers-reduced-motion: reduce) { .say.pop, .stamp.ok, .sheet { animation: none; } }
</style>
</head>
<body>
<main>
  <div class="head"><div class="nomy-box" id="nomy"></div><div class="say" id="say">読み込み中…</div></div>

  <div class="card" id="box">
    <div class="steps" aria-label="予約の流れ"><span id="s1">① 予約</span><i>›</i><span id="s2">② 主催者が確認</span><i>›</i><span id="s3">③ LINEで確定</span></div>
    <div class="ticket" id="ticket" hidden>
      <span class="stamp" id="stamp" hidden></span>
      <h2 id="evName"></h2>
      <dl id="evInfo"></dl>
    </div>

    <!-- 予約前 -->
    <div id="vForm" hidden>
      <p class="msg" style="margin-top:14px">この会に行けそう？</p>
      <label class="l" for="comment">主催者へひとこと（任意）</label>
      <textarea id="comment" maxlength="200" placeholder="例：はじめて参加します！よろしくお願いします"></textarea>
      <button class="btn" id="reserveBtn" type="button">🙋 行ける！予約する</button>
      <p class="note" id="needNote" hidden>※ 予約の前に、かんたんなアンケート（約1分）に答えてね。ボタンを押すとアンケートが開きます。</p>
      <button class="btn sub" id="declineBtn" type="button">🙇 今回は行けない</button>
      <p class="note">予約すると主催者が確認して、確定したらこのLINEのトークでお知らせします。</p>
    </div>

    <!-- 承認待ち・確定 -->
    <div id="vStatus" hidden>
      <p class="msg" id="statusMsg"></p>
      <p class="note" id="statusNote"></p>
      <div class="qrbox" id="qrbox" hidden><div id="qr" aria-label="受付用のQRコード"></div><p id="qrText">当日の受付でこのQRを見せてね</p></div>
      <div style="text-align:center"><span class="badge" id="badge" hidden></span></div>
      <a class="btn beer" id="toEvent" href="event.html">イベントの詳細を見る</a>
      <button class="btn sub" id="cancelBtn" type="button">予約を取り消す</button>
      <button class="btn" id="againBtn" type="button" hidden>🙋 やっぱり行ける！</button>
    </div>

    <!-- アンケート未回答 -->
    <div id="vNeed" hidden>
      <p class="msg">予約の前に、かんたんなアンケートに答えてね！</p>
      <a class="btn beer" id="toSurvey" href="./">アンケートに答える</a>
    </div>

    <p class="err" id="err" role="alert"></p>
  </div>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <h3 id="mTitle">この内容で予約を確定しますか？</h3>
    <p class="note" id="mBody" style="margin-top:0"></p>
    <button class="btn" id="mOk" type="button">確定する</button>
    <button class="btn sub" id="mNo" type="button">やめる</button>
  </div>
</div>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
const LIFF_ID = '2012697224-lfwPcqYm';
const GAS_URL = 'https://script.google.com/macros/s/AKfycby45UwD6Ymwvnf_D_4vMbUGY_m0DUGJtse1oD3hqwHVuDASQ996Xnu2-AKLAqKheMiytQ/exec';
const params = new URLSearchParams(location.search);
const PREVIEW = params.has('preview');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
const $ = (id) => document.getElementById(id);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

Nomy.installCSS();
$('nomy').innerHTML = Nomy.svg({ id: 'rn', face: 'normal' });
const nomy = $('nomy').querySelector('svg');
function say(t, face, move) {
  const s = $('say'); s.textContent = t; s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop');
  Nomy.setFace(nomy, face || 'normal'); if (move) Nomy.play(nomy, move);
}

let previewStatus = params.get('status') || '';
async function api(body) {
  if (PREVIEW) {
    await sleep(500);
    if (params.has('need')) return { ok: false, error: 'not_answered' };
    if (body.type === 'reserve') previewStatus = '申請中';
    if (body.type === 'reserveCancel') previewStatus = 'キャンセル';
    if (body.type === 'reserveDecline') previewStatus = '不参加';
    return { ok: true, status: previewStatus, nickname: 'ありす', notified: true, needSurvey: params.has('new'), code: previewStatus === '承認' ? 'abc123def456' : '', visits: 3,
      event: { name: '年末だよ！みんなで忘年会', date: '12/20(土) 19:00〜', place: '居酒屋 のんき', address: '渋谷区…', fee: '4,000円', deadline: '12/15' } };
  }
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 20000);
  try {
    const res = await fetch(GAS_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ ...body, idToken: liff.getIDToken() }), signal: ctl.signal });
    return await res.json();
  } finally { clearTimeout(timer); }
}

function renderEvent(ev) {
  if (!ev) return;
  $('ticket').hidden = false;
  $('evName').textContent = ev.name || 'イベント';
  const rows = [['日時', ev.date], ['場所', [ev.place, ev.address].filter(Boolean).join('\n')], ['会費', ev.fee], ['予約の締切', ev.deadline]].filter((r) => r[1]);
  $('evInfo').replaceChildren(...rows.flatMap(([k, v]) => [Object.assign(document.createElement('dt'), { textContent: k }), Object.assign(document.createElement('dd'), { textContent: v })]));
}

function setSteps(n) {
  ['s1', 's2', 's3'].forEach((id, i) => { $(id).className = i < n ? 'done' : i === n ? 'on' : ''; });
}

function render(res) {
  lastRes = res;
  if (typeof res.needSurvey === 'boolean') needSurvey = res.needSurvey;
  renderEvent(res.event);
  const st = res.status;
  ['vForm', 'vStatus', 'vNeed'].forEach((id) => { $(id).hidden = true; });
  const stamp = $('stamp');
  stamp.hidden = true;
  $('qrbox').hidden = true;
  if (res.visits) { $('badge').hidden = false; $('badge').textContent = badgeOf(res.visits) + '（参加' + res.visits + '回）'; }
  if (st === '申請中') {
    setSteps(1);
    stamp.hidden = false; stamp.className = 'stamp wait'; stamp.textContent = '承認待ち';
    $('vStatus').hidden = false;
    $('statusMsg').textContent = '予約を受け付けたよ！';
    $('statusNote').textContent = '主催者が確認中です。確定したら、このLINEのトークでお知らせします。少し待っててね🍻';
    $('cancelBtn').hidden = false;
    say(res.nickname + 'さん、予約ありがとう！', 'happy');
  } else if (st === '承認') {
    setSteps(3);
    stamp.hidden = false; stamp.className = 'stamp ok'; stamp.textContent = '予約確定';
    $('vStatus').hidden = false;
    $('statusMsg').textContent = '🎉 予約が確定しています！';
    $('statusNote').textContent = '当日会えるのを楽しみにしてるよ。受付で下のQRを見せてね。行けなくなったときは、下のボタンから取り消してね。';
    $('cancelBtn').hidden = !!res.checkedIn;
    showQr(res);
    say(res.checkedIn ? '来てくれてありがとう！' : '当日はカンパイしようね！', 'sparkle', 'jump');
  } else if (st === '見送り') {
    setSteps(1);
    stamp.hidden = false; stamp.className = 'stamp no'; stamp.textContent = '見送り';
    $('vStatus').hidden = false;
    $('statusMsg').textContent = '今回はご案内が難しくなりました';
    $('statusNote').textContent = '申請ありがとうございました。また次回の会でお会いできたらうれしいです🙇';
    $('cancelBtn').hidden = true;
    say('またね！', 'sad');
  } else if (st === '不参加') {
    setSteps(0);
    stamp.hidden = false; stamp.className = 'stamp no'; stamp.textContent = '今回は不参加';
    $('vStatus').hidden = false;
    $('statusMsg').textContent = '教えてくれてありがとう！';
    $('statusNote').textContent = '今回は不参加で受け付けたよ。予定が変わったら、下のボタンからいつでも予約できるよ。また次の会で会おうね🍻';
    $('cancelBtn').hidden = true; $('toEvent').hidden = true; $('againBtn').hidden = false;
    say('また次の会で会おうね！', 'wink');
  } else {
    setSteps(0);
    $('vForm').hidden = false;
    $('needNote').hidden = !needSurvey;
    say(st === 'キャンセル' ? 'もう一度予約する？' : '行けるかどうか教えてね！', 'happy');
  }
  if (st !== '不参加') { $('againBtn').hidden = true; $('toEvent').hidden = false; }
}

let needSurvey = false;
const SURVEY_URL = 'https://liff.line.me/' + LIFF_ID;
$('declineBtn').addEventListener('click', async () => {
  $('err').textContent = '';
  const ok = await confirmSheet('今回は「行けない」で送りますか？', '予定が変わったら、あとから予約することもできます。', '行けないで送る');
  if (!ok) return;
  $('declineBtn').disabled = true;
  try {
    const res = await api({ type: 'reserveDecline', comment: $('comment').value.trim() });
    if (!res.ok) throw new Error(res.error);
    render(res);
  } catch (e) { $('err').textContent = '送れませんでした。電波のいいところで、もう一度押してね。'; }
  $('declineBtn').disabled = false;
});
$('againBtn').addEventListener('click', () => { render({ ...lastRes, status: '' }); });
let lastRes = null;

const CHECKIN_BASE = 'https://liff.line.me/' + LIFF_ID + '/checkin.html?c=';
function loadQrLib() {
  if (window.QRCode) return Promise.resolve();
  return new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
    sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
  });
}
async function showQr(res) {
  if (res.visits) { $('badge').hidden = false; $('badge').textContent = badgeOf(res.visits) + '（参加' + res.visits + '回）'; }
  if (!res.code) return;
  $('qrbox').hidden = false;
  if (res.checkedIn) { $('qrText').textContent = '✅ 受付済み（' + res.checkedIn.slice(5, 16) + '）'; }
  try {
    await loadQrLib();
    $('qr').replaceChildren();
    new QRCode($('qr'), { text: CHECKIN_BASE + res.code, width: 400, height: 400, correctLevel: QRCode.CorrectLevel.M });
  } catch (e) { $('qrText').textContent = 'QRを表示できませんでした。開き直してね。'; }
}
function badgeOf(n) { return n >= 10 ? '👑 レジェンド' : n >= 5 ? '🔥 常連さん' : n >= 3 ? '⭐ リピーター' : n >= 1 ? '🌱 はじめまして' : ''; }

function confirmSheet(title, body, okText) {
  $('mTitle').textContent = title; $('mBody').textContent = body; $('mOk').textContent = okText;
  $('modal').classList.add('on'); $('mOk').focus();
  return new Promise((resolve) => {
    const done = (v) => { $('modal').classList.remove('on'); $('mOk').onclick = $('mNo').onclick = null; resolve(v); };
    $('mOk').onclick = () => done(true);
    $('mNo').onclick = () => done(false);
  });
}

function confetti() {
  if (REDUCED) return;
  const box = $('confetti'); box.replaceChildren();
  const colors = ['#E4572E', '#F6B93B', '#fff', '#2E9E6A'];
  for (let i = 0; i < 50; i++) {
    const c = document.createElement('i');
    c.style.cssText = `--x:${Math.random() * 100}%;--c:${colors[i % 4]};--d:${2 + Math.random() * 2}s;--delay:${Math.random() * .4}s;--drift:${(Math.random() - .5) * 120}px;--r:${(Math.random() - .5) * 900}deg`;
    box.append(c);
  }
}

$('reserveBtn').addEventListener('click', async () => {
  $('err').textContent = '';
  if (needSurvey) { location.href = SURVEY_URL; return; }
  const comment = $('comment').value.trim();
  const ok = await confirmSheet('この内容で予約を確定しますか？', $('evName').textContent + '\n' + (comment ? '主催者へ：' + comment : ''), '確定する');
  if (!ok) return;
  const b = $('reserveBtn'); b.disabled = true; b.textContent = '送信中…';
  say('とどけ〜！', 'wow');
  try {
    const res = await api({ type: 'reserve', comment });
    if (!res.ok) throw new Error(res.error || 'error');
    render(res);
    confetti();
  } catch (e) {
    $('err').textContent = '予約を送れませんでした。電波のいいところで、もう一度押してね。';
    say('あれれ…', 'sad', 'droop');
  } finally { b.disabled = false; b.textContent = '🎫 予約する'; }
});

$('cancelBtn').addEventListener('click', async () => {
  const ok = await confirmSheet('予約を取り消しますか？', '主催者に取り消しのお知らせが届きます。', '取り消す');
  if (!ok) return;
  $('cancelBtn').disabled = true;
  try {
    const res = await api({ type: 'reserveCancel' });
    if (res.ok) render(res);
    else $('err').textContent = '取り消せませんでした。';
  } catch (e) { $('err').textContent = '通信に失敗しました。もう一度押してね。'; }
  $('cancelBtn').disabled = false;
});

function loadSdk() {
  if (window.liff) return Promise.resolve();
  return new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js'; sc.charset = 'utf-8';
    sc.onload = res; sc.onerror = rej; document.head.appendChild(sc);
    setTimeout(() => rej(new Error('timeout')), 15000);
  });
}

async function main() {
  say('ちょっと待ってね…', 'normal');
  if (!PREVIEW) {
    try { await loadSdk(); await liff.init({ liffId: LIFF_ID }); } catch (e) { $('err').textContent = 'LINEアプリから開いてね。'; return; }
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
    $('toSurvey').href = 'https://liff.line.me/' + LIFF_ID;
  }
  let res;
  try { res = await api({ type: 'reserveStatus' }); } catch (e) { $('err').textContent = '読み込めませんでした。開き直してね。'; return; }
  if (!res.ok) {
    if (res.error === 'not_answered') { $('vNeed').hidden = false; say('先にアンケートをお願い！', 'wink'); return; }
    if (res.error === 'auth' && !PREVIEW && !liff.isInClient()) { liff.logout(); liff.login({ redirectUri: location.href }); return; }
    $('err').textContent = '読み込めませんでした。開き直してね。';
    return;
  }
  render(res);
}
main();
</script>
</body>
</html>
