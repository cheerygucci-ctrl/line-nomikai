<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飲み会アンケート</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="nomy.js"></script>
<style>
  :root {
    --beer-top: #FFD866;
    --beer-bottom: #F3A21C;
    --ink: #4A2A0A;
    --ink-soft: #7A5528;
    --card: #FFFFFF;
    --chip: #FFF3D1;
    --lantern: #E4572E;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; color: var(--ink);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    font-size: 16px; line-height: 1.6;
    background: linear-gradient(180deg, var(--beer-top), var(--beer-bottom)) fixed;
    overflow-x: hidden;
  }
  /* 泡のふち＋炭酸 */
  .foam-edge { position: fixed; inset: 0 0 auto 0; height: 34px; z-index: 0; pointer-events: none; }
  .bubbles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  .bubbles i {
    position: absolute; bottom: -20px; width: var(--s); height: var(--s); left: var(--x);
    border-radius: 50%; background: rgba(255,255,255,.55); box-shadow: inset -2px -2px 0 rgba(255,255,255,.4);
    animation: rise var(--d) linear var(--delay) infinite;
  }
  @keyframes rise { to { transform: translate(var(--drift), -110vh); } }

  .app { position: relative; z-index: 1; max-width: 460px; margin: 0 auto; min-height: 100%;
    padding: calc(40px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; }

  .progress { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 13px; color: var(--ink-soft); }
  .progress .track { flex: 1; height: 10px; background: rgba(255,255,255,.45); border-radius: 999px; overflow: hidden; }
  .progress .fill { height: 100%; width: 0; background: #fff; border-radius: 999px; transition: width .4s ease; }
  .progress[hidden] { display: block; visibility: hidden; }

  .stage { display: grid; grid-template-columns: 112px 1fr; align-items: end; gap: 8px; margin: 14px 0 10px; }
  .nomy-wrap { width: 112px; }
  .say {
    position: relative; background: var(--card); border-radius: 20px 20px 20px 6px; padding: 12px 14px;
    font-weight: 700; margin-bottom: 30px; min-height: 52px;
    box-shadow: 0 3px 0 rgba(74,42,10,.15);
  }
  .say::before { content: ""; position: absolute; left: -9px; bottom: 6px; border: 10px solid transparent; border-right-color: var(--card); border-left: 0; }
  .say.pop { animation: pop .35s cubic-bezier(.3,1.5,.6,1); }
  @keyframes pop { from { transform: scale(.85); opacity: .2; } }

  .card {
    background: var(--card); border-radius: 26px; padding: 22px 18px; box-shadow: 0 6px 0 rgba(74,42,10,.18);
    flex: 1 0 auto; display: flex; flex-direction: column;
  }
  .step { display: none; flex-direction: column; gap: 14px; flex: 1; }
  .step.on { display: flex; animation: slide .35s ease; }
  .step.back.on { animation-name: slideBack; }
  @keyframes slide { from { transform: translateX(24px); opacity: 0; } }
  @keyframes slideBack { from { transform: translateX(-24px); opacity: 0; } }
  .q { font-size: 21px; font-weight: 900; line-height: 1.4; margin: 0; }
  .hint { margin: -6px 0 0; color: var(--ink-soft); font-size: 14px; }
  .tag { display: inline-block; font-size: 12px; border-radius: 6px; padding: 0 7px; margin-left: 6px; vertical-align: 3px; font-weight: 700; }
  .tag.req { background: var(--lantern); color: #fff; }
  .tag.opt { background: var(--chip); color: var(--ink-soft); }

  input[type=text], textarea {
    width: 100%; font: inherit; font-size: 17px; color: inherit; background: #FFFBF0;
    border: 2px solid #F1DFB2; border-radius: 14px; padding: 12px 14px; -webkit-appearance: none;
  }
  textarea { min-height: 120px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--beer-bottom); background: #fff; }
  .count { text-align: right; font-size: 12px; color: var(--ink-soft); margin-top: -8px; }

  .choices { display: grid; gap: 10px; }
  .choices input { position: absolute; opacity: 0; pointer-events: none; }
  .choices label {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; cursor: pointer;
    background: var(--chip); border: 2px solid transparent; font-weight: 700; font-size: 17px;
    transition: transform .15s ease;
  }
  .choices label .em { font-size: 26px; line-height: 1; }
  .choices input:checked + label { background: #fff; border-color: var(--beer-bottom); box-shadow: 0 4px 0 var(--beer-bottom); transform: translateY(-2px); }
  .choices input:focus-visible + label { outline: 3px solid var(--ink); outline-offset: 2px; }

  .err { color: var(--lantern); font-weight: 700; font-size: 14px; min-height: 1.4em; margin: 0; }
  .nav { display: flex; gap: 10px; align-items: center; margin-top: auto; padding-top: 8px; }
  .btn {
    font: inherit; font-weight: 900; font-size: 17px; border: 0; border-radius: 999px; padding: 14px 22px; cursor: pointer;
    background: var(--ink); color: #fff; flex: 1; box-shadow: 0 4px 0 #2A1604;
  }
  .btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #2A1604; }
  .btn:disabled { opacity: .6; }
  .btn.ghost { flex: 0 0 auto; background: transparent; color: var(--ink-soft); box-shadow: none; padding: 14px 8px; }
  .btn:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }

  .intro .big { font-size: 26px; font-weight: 900; line-height: 1.35; margin: 0; }
  .intro p { margin: 0; color: var(--ink-soft); }
  .intro ul { margin: 0; padding-left: 1.2em; color: var(--ink-soft); font-size: 14px; }

  /* カンパイ画面 */
  .done { position: fixed; inset: 0; z-index: 5; display: none; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; padding: 24px 16px; background: linear-gradient(180deg, var(--beer-top), var(--beer-bottom)); }
  .done.show { display: flex; }
  .clink { position: relative; width: 300px; height: 190px; }
  .clink .m { position: absolute; bottom: 0; width: 130px; }
  .clink .m1 { left: 0; animation: toR 1.1s cubic-bezier(.5,0,.3,1) forwards; }
  .clink .m2 { right: 0; transform: scaleX(-1); animation: toL 1.1s cubic-bezier(.5,0,.3,1) forwards; }
  @keyframes toR { 0% { transform: translateX(-60px) rotate(0); } 60% { transform: translateX(36px) rotate(14deg); } 72% { transform: translateX(22px) rotate(8deg); } 100% { transform: translateX(26px) rotate(10deg); } }
  @keyframes toL { 0% { transform: scaleX(-1) translateX(-60px) rotate(0); } 60% { transform: scaleX(-1) translateX(36px) rotate(14deg); } 72% { transform: scaleX(-1) translateX(22px) rotate(8deg); } 100% { transform: scaleX(-1) translateX(26px) rotate(10deg); } }
  .splash { position: absolute; left: 50%; top: 22px; width: 0; height: 0; }
  .splash i { position: absolute; width: var(--s); height: var(--s); border-radius: 50%; background: #fff; opacity: 0;
    animation: burst .9s ease-out .62s forwards; }
  @keyframes burst { 0% { opacity: 1; transform: translate(0,0) scale(.4); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); } }
  .kanpai { font-size: 44px; font-weight: 900; color: #fff; margin: 18px 0 4px; letter-spacing: .04em;
    text-shadow: 0 4px 0 var(--ink); opacity: 0; transform: scale(.6); animation: shout .5s cubic-bezier(.3,1.6,.5,1) .7s forwards; }
  @keyframes shout { to { opacity: 1; transform: scale(1); } }
  .done h2 { margin: 6px 0 4px; font-size: 20px; }
  .done p { margin: 0 0 18px; color: var(--ink-soft); font-weight: 700; }
  .done .btn { flex: 0 0 auto; min-width: 240px; }
  .done a.sub { margin-top: 14px; color: var(--ink); font-weight: 700; }
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .confetti i { position: absolute; top: -20px; left: var(--x); width: 9px; height: 14px; background: var(--c); border-radius: 2px;
    animation: fall var(--d) linear var(--delay) forwards; }
  @keyframes fall { to { transform: translate(var(--drift), 110vh) rotate(var(--r)); } }

  .loading { flex: 1; display: flex; align-items: center; justify-content: center; font-weight: 700; }
  .banner { display: none; background: #fff; border-left: 6px solid var(--lantern); border-radius: 12px; padding: 10px 12px; font-weight: 700; margin-bottom: 10px; font-size: 14px; }
  .banner.show { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .bubbles, .confetti { display: none; }
    .step.on, .say.pop, .clink .m1, .clink .m2, .splash i, .kanpai { animation: none !important; }
    .kanpai { opacity: 1; transform: none; }
    .clink .m1 { transform: translateX(26px) rotate(10deg); } .clink .m2 { transform: scaleX(-1) translateX(26px) rotate(10deg); }
  }
</style>
</head>
<body>
<svg class="foam-edge" viewBox="0 0 400 34" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 0 H400 V18 C380 30 360 30 340 20 C320 32 290 32 270 20 C250 32 220 30 200 20 C180 32 150 32 130 20 C110 30 80 32 60 20 C40 30 20 30 0 18Z" fill="#fff"/>
</svg>
<div class="bubbles" id="bubbles" aria-hidden="true"></div>

<div class="app">
  <div class="progress" id="progress" hidden><div class="track"><div class="fill" id="pfill"></div></div><span id="ptext"></span></div>

  <div class="stage">
    <div class="nomy-wrap" id="nomyWrap"></div>
    <div class="say" id="say" aria-live="polite">よみこみ中…</div>
  </div>

  <div class="banner" id="banner" role="alert"></div>

  <form class="card" id="form" novalidate>
    <div class="loading" id="loading">ちょっと待ってね…</div>

    <section class="step intro" data-step="intro">
      <p class="big" id="introTitle">飲み会アンケート</p>
      <p id="introText">7つの質問に答えるだけ。1分くらいで終わるよ！</p>
      <ul><li>答えると、トーク画面にメニューが出てくるよ</li><li>あとから何度でも直せるよ</li></ul>
      <div class="nav"><button type="button" class="btn" data-next id="startBtn">はじめる</button></div>
    </section>

    <section class="step" data-step="nickname" data-say="まずは、なんて呼べばいい？">
      <label class="q" for="nickname">お名前（ニックネーム）<span class="tag req">必須</span></label>
      <input type="text" id="nickname" name="nickname" maxlength="30" autocomplete="nickname" enterkeyhint="next">
      <p class="err" data-err></p>
      <div class="nav"><button type="button" class="btn ghost" data-back>もどる</button><button type="button" class="btn" data-next>つぎへ</button></div>
    </section>

    <section class="step" data-step="attend" data-say="来てくれるかな…？ドキドキ">
      <p class="q" id="attendQ">参加しますか？<span class="tag req">必須</span></p>
      <div class="choices" role="radiogroup" aria-labelledby="attendQ">
        <input type="radio" id="a1" name="attend" value="参加"><label for="a1"><span class="em">🙋</span>参加する！</label>
        <input type="radio" id="a2" name="attend" value="不参加"><label for="a2"><span class="em">🙇</span>今回は不参加</label>
      </div>
      <p class="err" data-err></p>
      <div class="nav"><button type="button" class="btn ghost" data-back>もどる</button><button type="button" class="btn" data-next>つぎへ</button></div>
    </section>

    <section class="step" data-step="drink" data-say="お酒は飲む派？">
      <p class="q" id="drinkQ">お酒は飲みますか？<span class="tag opt">任意</span></p>
      <div class="choices" role="radiogroup" aria-labelledby="drinkQ">
        <input type="radio" id="d1" name="drink" value="飲む"><label for="d1"><span class="em">🍺</span>飲む！</label>
        <input type="radio" id="d2" name="drink" value="少し"><label for="d2"><span class="em">🥂</span>少しだけ</label>
        <input type="radio" id="d3" name="drink" value="飲まない"><label for="d3"><span class="em">🧃</span>飲まない</label>
      </div>
      <div class="nav"><button type="button" class="btn ghost" data-back>もどる</button><button type="button" class="btn" data-next>つぎへ</button></div>
    </section>

    <section class="step" data-step="ng" data-say="苦手な食べ物やアレルギー、ある？">
      <label class="q" for="ng">食べられないもの・アレルギー<span class="tag opt">任意</span></label>
      <p class="hint">なければ空のままでOK！お店に伝えるね。</p>
      <input type="text" id="ng" name="ng" maxlength="200" placeholder="例：えび、生もの" enterkeyhint="next">
      <div class="nav"><button type="button" class="btn ghost" data-back>もどる</button><button type="button" class="btn" data-next>つぎへ</button></div>
    </section>

    <section class="step" data-step="dream" data-say="ねえねえ、将来の夢ってある？✨" data-face="sparkle">
      <label class="q" for="dream">将来の夢・やりたいこと<span class="tag opt">任意</span></label>
      <p class="hint">大きな夢でも、小さなやりたいことでも！</p>
      <textarea id="dream" name="dream" maxlength="1000" placeholder="例：いつか自分のカフェを開きたい"></textarea>
      <div class="count" data-for="dream"></div>
      <div class="nav"><button type="button" class="btn ghost" data-back>もどる</button><button type="button" class="btn" data-next>つぎへ</button></div>
    </section>

    <section class="step" data-step="goal" data-say="いまの目標も聞かせて！応援するよ" data-face="sparkle">
      <label class="q" for="goal">目標<span class="tag opt">任意</span></label>
      <p class="hint">今年や今月の目標など</p>
      <textarea id="goal" name="goal" maxlength="1000" placeholder="例：今年中にフルマラソン完走"></textarea>
      <div class="count" data-for="goal"></div>
      <div class="nav"><button type="button" class="btn ghost" data-back>もどる</button><button type="button" class="btn" data-next>つぎへ</button></div>
    </section>

    <section class="step" data-step="comment" data-say="さいごに、ひとことどうぞ！" data-face="wink">
      <label class="q" for="comment">ひとこと<span class="tag opt">任意</span></label>
      <textarea id="comment" name="comment" maxlength="500" placeholder="意気込みや質問などあればどうぞ"></textarea>
      <div class="count" data-for="comment"></div>
      <div class="nav"><button type="button" class="btn ghost" data-back>もどる</button><button type="submit" class="btn" id="submit">送信してカンパイ！</button></div>
    </section>
  </form>
</div>

<div class="done" id="done" role="dialog" aria-labelledby="doneTitle">
  <div class="clink" aria-hidden="true">
    <div class="m m1" id="m1"></div>
    <div class="m m2" id="m2"></div>
    <div class="splash" id="splash"></div>
  </div>
  <div class="kanpai" aria-hidden="true">カンパーイ！</div>
  <h2 id="doneTitle">回答ありがとうございます！</h2>
  <p>トークにもどると、メニューが出てるよ🍻</p>
  <button type="button" class="btn" id="close">トークにもどる</button>
  <a class="sub" href="event.html">イベントの詳細を見る</a>
  <div class="confetti" id="confetti" aria-hidden="true"></div>
</div>

<script>
const LIFF_ID = '2012697224-lfwPcqYm';
const GAS_URL = 'https://script.google.com/macros/s/AKfycby45UwD6Ymwvnf_D_4vMbUGY_m0DUGJtse1oD3hqwHVuDASQ996Xnu2-AKLAqKheMiytQ/exec';

// ?preview=1 で LINE につながずに見た目だけ確認できる（送信もしない）
const params = new URLSearchParams(location.search);
const PREVIEW = params.has('preview');
const FIELDS = ['nickname', 'attend', 'drink', 'ng', 'dream', 'goal', 'comment'];
const $ = (id) => document.getElementById(id);
const form = $('form');
const steps = [...document.querySelectorAll('.step')];
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
let cur = 0;
let returning = false;

Nomy.installCSS();
$('nomyWrap').innerHTML = Nomy.svg({ id: 'main' });
const nomy = $('nomyWrap').querySelector('svg');

// 炭酸の泡
(function bubbles() {
  if (REDUCED) return;
  const box = $('bubbles');
  for (let i = 0; i < 18; i++) {
    const b = document.createElement('i');
    const s = 4 + Math.random() * 10;
    b.style.cssText = `--s:${s}px;--x:${Math.random() * 100}%;--d:${6 + Math.random() * 8}s;--delay:${-Math.random() * 10}s;--drift:${(Math.random() - .5) * 60}px`;
    box.appendChild(b);
  }
})();

function say(text, face, move) {
  const el = $('say');
  el.textContent = text;
  el.classList.remove('pop'); void el.offsetWidth; el.classList.add('pop');
  Nomy.setFace(nomy, face || 'normal');
  if (move) Nomy.play(nomy, move);
}

function visibleSteps() {
  // 不参加ならお酒・食べ物の質問は飛ばす
  const notGoing = form.elements.attend.value === '不参加';
  return steps.filter((s) => !(notGoing && (s.dataset.step === 'drink' || s.dataset.step === 'ng')));
}

function go(i, dir) {
  const vis = visibleSteps();
  i = Math.max(0, Math.min(i, vis.length - 1));
  steps.forEach((s) => s.classList.remove('on', 'back'));
  const s = vis[i];
  if (dir < 0) s.classList.add('back');
  s.classList.add('on');
  cur = i;
  const total = vis.length - 1;
  $('progress').hidden = i === 0;
  $('pfill').style.width = (i / total * 100) + '%';
  $('ptext').textContent = i === total ? 'さいご！' : `${i} / ${total}`;
  if (s.dataset.say) say(s.dataset.say, s.dataset.face || 'normal');
  const first = s.querySelector('input[type=text], textarea');
  if (first && i > 0) setTimeout(() => first.focus({ preventScroll: true }), 50);
  window.scrollTo({ top: 0, behavior: REDUCED ? 'auto' : 'smooth' });
}

function current() { return visibleSteps()[cur]; }

function check(s) {
  const k = s.dataset.step;
  const err = s.querySelector('[data-err]');
  let msg = '';
  if (k === 'nickname' && !form.elements.nickname.value.trim()) msg = 'お名前を入れてね';
  if (k === 'attend' && !form.elements.attend.value) msg = 'どちらか選んでね';
  if (err) err.textContent = msg;
  if (msg) { say(msg, 'wow', 'wiggle'); return false; }
  return true;
}

form.addEventListener('click', (e) => {
  if (e.target.closest('[data-next]')) {
    if (!check(current())) return;
    go(cur + 1, 1);
  } else if (e.target.closest('[data-back]')) {
    go(cur - 1, -1);
  }
});

// 選んだ瞬間にノミィが反応
const REACT = {
  attend: { '参加': ['やったー！待ってるね！', 'happy', 'jump'], '不参加': ['そっかぁ…また今度ね！', 'sad', 'droop'] },
  drink: { '飲む': ['いいね、いっぱいカンパイしよ！', 'happy', 'jump'], '少し': ['ほどほどがいちばん！', 'wink', 'wiggle'], '飲まない': ['ソフドリでも楽しもうね！', 'happy', 'wiggle'] },
};
form.addEventListener('change', (e) => {
  const r = REACT[e.target.name] && REACT[e.target.name][e.target.value];
  if (r) say(r[0], r[1], r[2]);
  const err = e.target.closest('.step') && e.target.closest('.step').querySelector('[data-err]');
  if (err) err.textContent = '';
});

form.addEventListener('input', (e) => {
  updateCounts();
  if (e.target.name === 'nickname' && e.target.value.trim().length === 1) say('いい名前！', 'happy');
});

form.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.matches('input[type=text]') && !e.isComposing) {
    e.preventDefault();
    if (check(current())) go(cur + 1, 1);
  }
});

function updateCounts() {
  document.querySelectorAll('.count').forEach((c) => {
    const el = $(c.dataset.for);
    c.textContent = `${el.value.length} / ${el.maxLength}`;
  });
}

function getValues() {
  const out = {};
  FIELDS.forEach((k) => { out[k] = String(form.elements[k].value || '').trim(); });
  if (out.attend === '不参加') { out.drink = ''; out.ng = ''; }
  return out;
}

function setValues(a) {
  FIELDS.forEach((k) => {
    const v = a[k] || '';
    const el = form.elements[k];
    if (el instanceof RadioNodeList) [...el].forEach((r) => { r.checked = r.value === v; });
    else el.value = v;
  });
  updateCounts();
}

function banner(msg) {
  $('banner').textContent = msg || '';
  $('banner').classList.toggle('show', !!msg);
}

async function api(body) {
  if (PREVIEW) {
    await new Promise((r) => setTimeout(r, 500));
    return body.type === 'load' ? { ok: true, answer: params.has('again') ? { nickname: 'ありす', attend: '参加', drink: '少し', ng: '', dream: '', goal: '', comment: '' } : null } : { ok: true };
  }
  const res = await fetch(GAS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // CORSの事前確認を避ける
    body: JSON.stringify({ ...body, idToken: liff.getIDToken() }),
  });
  return res.json();
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  banner('');
  const v = getValues();
  if (!v.nickname) { go(visibleSteps().findIndex((s) => s.dataset.step === 'nickname'), -1); return check(current()); }
  if (!v.attend) { go(visibleSteps().findIndex((s) => s.dataset.step === 'attend'), -1); return check(current()); }
  const btn = $('submit');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = '送信中…';
  say('とどけ〜！', 'wow');
  try {
    const res = await api({ type: 'answer', answer: v });
    if (res.ok) return celebrate();
    if (res.error === 'auth') banner('ログインの期限が切れたみたい。画面を閉じて、もう一度開いてね。');
    else if (res.error === 'invalid') banner('入力内容をもう一度確認してね。');
    else banner('回答は保存できたけど、メニューを出せなかったよ。主催者に連絡してね。');
    say('あれれ…', 'sad', 'droop');
  } catch (err) {
    banner('通信に失敗したよ。電波のいいところで、もう一度送信してね。');
    say('電波が…', 'sad', 'droop');
  } finally {
    btn.disabled = false; btn.textContent = label;
  }
});

function celebrate() {
  $('m1').innerHTML = Nomy.svg({ id: 'c1', face: 'happy' });
  $('m2').innerHTML = Nomy.svg({ id: 'c2', face: 'happy', dark: true });
  const sp = $('splash');
  sp.replaceChildren();
  for (let i = 0; i < 14; i++) {
    const d = document.createElement('i');
    const a = (Math.PI * 2 * i) / 14;
    const r = 50 + Math.random() * 50;
    d.style.cssText = `--s:${8 + Math.random() * 12}px;--dx:${Math.cos(a) * r}px;--dy:${Math.sin(a) * r - 30}px`;
    sp.appendChild(d);
  }
  if (!REDUCED) {
    const colors = ['#fff', '#E4572E', '#4A2A0A', '#FFF3D1', '#7CC4F2'];
    const box = $('confetti');
    box.replaceChildren();
    for (let i = 0; i < 60; i++) {
      const c = document.createElement('i');
      c.style.cssText = `--x:${Math.random() * 100}%;--c:${colors[i % colors.length]};--d:${2.2 + Math.random() * 2}s;--delay:${.6 + Math.random() * .8}s;--drift:${(Math.random() - .5) * 120}px;--r:${(Math.random() - .5) * 900}deg`;
      box.appendChild(c);
    }
  }
  $('done').classList.add('show');
  $('close').focus();
}

$('close').addEventListener('click', () => {
  if (!PREVIEW && liff.isInClient()) liff.closeWindow();
  else $('done').classList.remove('show');
});

function fatal(msg) {
  $('loading').textContent = msg;
  say('うまく開けなかったみたい…', 'sad');
}

async function main() {
  updateCounts();
  say('やあ！ノミィだよ🍺', 'happy', 'jump');
  if (!PREVIEW) {
    try { await liff.init({ liffId: LIFF_ID }); } catch (e) { return fatal('LINEアプリから、もう一度開いてね。'); }
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
  }
  try {
    const res = await api({ type: 'load' });
    if (res.ok && res.answer) {
      setValues(res.answer);
      returning = true;
    } else if (!res.ok && res.error === 'auth' && !PREVIEW) {
      liff.logout(); liff.login({ redirectUri: location.href }); return;
    }
  } catch (e) { /* 読み込めなくても新しく答えられる */ }
  $('loading').remove();
  if (returning) {
    $('introTitle').textContent = 'おかえり！';
    $('introText').textContent = 'まえの回答が入ってるよ。直したいところだけ変えてね。';
    $('startBtn').textContent = '直しはじめる';
    $('submit').textContent = '更新してカンパイ！';
  }
  go(0, 1);
  say(returning ? `おかえり、${form.elements.nickname.value}さん！` : 'やあ！ノミィだよ🍺 いくつか質問させてね！', 'happy', 'jump');
}
main();
</script>
</body>
</html>
