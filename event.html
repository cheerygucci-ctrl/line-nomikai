<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>イベント詳細</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<script src="nomy.js"></script>
<script>document.documentElement.classList.add('js');</script>
<style>
  :root {
    --night: #1F2A44;
    --night-2: #2B3A5C;
    --lantern: #E4572E;
    --beer: #F6B93B;
    --ink: #2A1C0C;
    --sub: #6B5A44;
    --paper: #FFF6DE;
    --card: #FFFFFF;
    --line: #F0E2BC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; color: var(--ink); background: var(--paper);
    font-family: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
    font-size: 16px; line-height: 1.7;
  }
  .hero {
    position: relative; background: radial-gradient(120% 80% at 50% 0%, var(--night-2), var(--night));
    color: #fff; text-align: center; padding: calc(28px + env(safe-area-inset-top)) 16px 0; overflow: hidden;
  }
  .hero .string { position: absolute; top: 0; left: 0; right: 0; height: 60px; }
  .lanterns { display: flex; justify-content: space-between; max-width: 520px; margin: 0 auto; padding: 0 8px; }
  .lanterns svg { width: 44px; transform-origin: 50% 0; animation: sway 3.2s ease-in-out infinite; }
  .lanterns svg:nth-child(2) { animation-delay: -1.1s; } .lanterns svg:nth-child(3) { animation-delay: -2.2s; }
  @keyframes sway { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
  .hero h1 { font-size: clamp(28px, 8vw, 42px); font-weight: 900; line-height: 1.25; margin: 14px auto 8px; max-width: 14em; word-break: auto-phrase; }
  .hero .when { display: inline-block; background: var(--beer); color: var(--ink); font-weight: 900; font-size: 18px; border-radius: 12px; padding: 4px 14px; }
  .hero .place { margin: 8px 0 0; color: #D7DEEE; font-weight: 700; }
  .hero .nomy-row { display: flex; align-items: flex-end; justify-content: center; gap: 10px; margin-top: 18px; }
  .hero .nomy-box { width: 120px; margin-bottom: -6px; }
  .count {
    background: #fff; color: var(--ink); border-radius: 18px 18px 18px 4px; padding: 8px 14px; font-weight: 900;
    margin-bottom: 70px; text-align: left; line-height: 1.4;
  }
  .count b { font-size: 26px; color: var(--lantern); font-variant-numeric: tabular-nums; }
  .counter-ground { height: 22px; background: #8A5A2B; border-top: 6px solid #A8723D; margin: 0 -16px; }

  main { max-width: 640px; margin: 0 auto; padding: 8px 16px 120px; }
  section { margin-top: 32px; }
  h2 { font-size: 20px; font-weight: 900; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h2 .ic { font-size: 22px; }

  .facts { display: grid; grid-template-columns: auto 1fr; gap: 0; background: var(--card); border-radius: 18px; overflow: hidden; margin: 0; }
  .facts dt, .facts dd { padding: 12px 16px; margin: 0; border-bottom: 1px solid var(--line); }
  .facts dt { color: var(--sub); font-weight: 700; font-size: 14px; white-space: nowrap; }
  .facts dd { font-weight: 700; word-break: break-word; }
  .facts > :nth-last-child(-n+2) { border-bottom: 0; }

  .map { border-radius: 18px; overflow: hidden; background: var(--card); }
  .map iframe { display: block; width: 100%; height: 260px; border: 0; }
  .map .addr { padding: 12px 16px; font-weight: 700; }
  .map .addr small { display: block; color: var(--sub); font-weight: 500; }
  .btn-map { display: inline-flex; align-items: center; gap: 6px; margin: 0 16px 16px; padding: 10px 16px; border-radius: 999px;
    background: var(--night); color: #fff; text-decoration: none; font-weight: 700; }

  ol.flow { list-style: none; margin: 0; padding: 0; position: relative; }
  ol.flow::before { content: ""; position: absolute; left: 62px; top: 10px; bottom: 10px; width: 3px; background: var(--line); border-radius: 2px; }
  ol.flow li { display: grid; grid-template-columns: 52px 22px 1fr; align-items: start; gap: 6px; padding: 6px 0; }
  ol.flow .t { font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
  ol.flow .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--beer); border: 3px solid var(--paper); margin: 4px auto 0; position: relative; z-index: 1; }
  ol.flow li:first-child .dot { background: var(--lantern); }
  ol.flow .what { background: var(--card); border-radius: 12px; padding: 6px 12px; font-weight: 700; }

  .notes { background: var(--card); border-radius: 18px; padding: 14px 16px; white-space: pre-wrap; word-break: break-word; margin: 0; }
  .empty { color: var(--sub); font-size: 15px; }

  .cta {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(transparent, rgba(255,246,222,.95) 30%); display: flex; justify-content: center;
  }
  .cta a {
    flex: 1; max-width: 420px; text-align: center; text-decoration: none; background: var(--lantern); color: #fff;
    font-weight: 900; font-size: 17px; border-radius: 999px; padding: 14px; box-shadow: 0 4px 0 #A8381A;
  }
  .cta a:focus-visible, .btn-map:focus-visible { outline: 3px solid var(--beer); outline-offset: 2px; }
  .deadline { text-align: center; color: var(--sub); font-size: 14px; font-weight: 700; margin-top: 8px; }
  .err { background: #fff; border-left: 6px solid var(--lantern); border-radius: 12px; padding: 12px; font-weight: 700; }
  .skeleton { color: transparent; background: rgba(255,255,255,.18); border-radius: 8px; }

  .about { background: var(--card); border-radius: 18px; padding: 14px 16px; }
  .about p { margin: 0; white-space: pre-wrap; font-weight: 700; }
  .rules { margin-top: 12px; background: #FFF0E8; border-radius: 14px; padding: 12px 14px; }
  .rules b { color: var(--lantern); display: block; margin-bottom: 4px; }
  .rules p { white-space: pre-wrap; font-size: 14px; font-weight: 500; }

  /* ページを開いたときの登場（1回だけ） */
  .js .lanterns svg { animation: drop .7s cubic-bezier(.3,1.5,.5,1) both, sway 3.2s ease-in-out .7s infinite; }
  .js .lanterns svg:nth-child(2) { animation-delay: .12s, .82s; } .js .lanterns svg:nth-child(3) { animation-delay: .24s, .94s; }
  @keyframes drop { from { transform: translateY(-80px) rotate(-10deg); opacity: 0; } }
  .js .hero h1, .js .hero .when, .js .hero .place { animation: rise-in .6s cubic-bezier(.2,.8,.2,1) both; }
  .js .hero h1 { animation-delay: .35s; } .js .hero .when { animation-delay: .5s; } .js .hero .place { animation-delay: .6s; }
  .js .hero .nomy-box { animation: peek .8s cubic-bezier(.3,1.4,.5,1) .7s both; }
  .js .hero .count { animation: pop .5s cubic-bezier(.3,1.5,.6,1) 1.2s both; transform-origin: 0 100%; }
  @keyframes rise-in { from { opacity: 0; transform: translateY(14px); } }
  @keyframes peek { from { transform: translateY(70px); } }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } }
  /* スクロールで出てくる */
  .js .reveal { opacity: 0; transform: translateY(18px); transition: opacity .6s ease, transform .6s cubic-bezier(.2,.8,.2,1); }
  .js .reveal.in { opacity: 1; transform: none; }
  .js ol.flow li { opacity: 0; transform: translateX(-10px); transition: opacity .4s ease, transform .4s ease; transition-delay: calc(var(--i) * 90ms); }
  .js .in ol.flow li { opacity: 1; transform: none; }
  .js ol.flow .dot { transform: scale(0); transition: transform .35s cubic-bezier(.3,1.6,.5,1); transition-delay: calc(var(--i) * 90ms + 120ms); }
  .js .in ol.flow .dot { transform: scale(1); }
  .cta a { transition: transform .15s ease; }
  .cta a:active { transform: translateY(2px); }
  .js .cta { animation: rise-in .5s ease 1.4s both; }

  @media (prefers-reduced-motion: reduce) {
    .lanterns svg, .js .lanterns svg, .js .hero h1, .js .hero .when, .js .hero .place, .js .hero .nomy-box, .js .hero .count, .js .cta { animation: none !important; }
    .js .reveal, .js ol.flow li, .js ol.flow .dot { opacity: 1 !important; transform: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header class="hero">
  <div class="lanterns" aria-hidden="true">
    <svg viewBox="0 0 44 70"><line x1="22" y1="0" x2="22" y2="10" stroke="#C9D2E4" stroke-width="2"/><rect x="14" y="8" width="16" height="6" rx="2" fill="#2A1C0C"/><ellipse cx="22" cy="36" rx="18" ry="22" fill="#E4572E"/><path d="M6 30 h32 M5 38 h34 M7 46 h30" stroke="#B83A1C" stroke-width="2"/><rect x="14" y="56" width="16" height="6" rx="2" fill="#2A1C0C"/><ellipse cx="22" cy="36" rx="10" ry="18" fill="#FF8A5C" opacity=".35"/></svg>
    <svg viewBox="0 0 44 70"><line x1="22" y1="0" x2="22" y2="10" stroke="#C9D2E4" stroke-width="2"/><rect x="14" y="8" width="16" height="6" rx="2" fill="#2A1C0C"/><ellipse cx="22" cy="36" rx="18" ry="22" fill="#F6B93B"/><path d="M6 30 h32 M5 38 h34 M7 46 h30" stroke="#C98A16" stroke-width="2"/><rect x="14" y="56" width="16" height="6" rx="2" fill="#2A1C0C"/><ellipse cx="22" cy="36" rx="10" ry="18" fill="#FFE08A" opacity=".4"/></svg>
    <svg viewBox="0 0 44 70"><line x1="22" y1="0" x2="22" y2="10" stroke="#C9D2E4" stroke-width="2"/><rect x="14" y="8" width="16" height="6" rx="2" fill="#2A1C0C"/><ellipse cx="22" cy="36" rx="18" ry="22" fill="#E4572E"/><path d="M6 30 h32 M5 38 h34 M7 46 h30" stroke="#B83A1C" stroke-width="2"/><rect x="14" y="56" width="16" height="6" rx="2" fill="#2A1C0C"/><ellipse cx="22" cy="36" rx="10" ry="18" fill="#FF8A5C" opacity=".35"/></svg>
  </div>
  <h1 id="name"><span class="skeleton">イベント名を読み込み中</span></h1>
  <span class="when" id="date">…</span>
  <p class="place" id="placeTop"></p>
  <div class="nomy-row">
    <div class="nomy-box" id="nomy"></div>
    <p class="count" id="count" aria-live="polite">いま<br><b>–</b> 人が参加予定！</p>
  </div>
  <div class="counter-ground" aria-hidden="true"></div>
</header>

<main id="main">
  <section class="reveal" aria-labelledby="h-about">
    <h2 id="h-about"><span class="ic" aria-hidden="true">🍻</span>この会について</h2>
    <div class="about"><p id="greet"></p><div class="rules"><b>参加ルール</b><p id="rules"></p></div></div>
  </section>

  <section class="reveal" aria-labelledby="h-basic">
    <h2 id="h-basic"><span class="ic" aria-hidden="true">📅</span>基本情報</h2>
    <dl class="facts" id="facts"></dl>
  </section>

  <section class="reveal" id="access" aria-labelledby="h-access">
    <h2 id="h-access"><span class="ic" aria-hidden="true">📍</span>アクセス</h2>
    <div class="map" id="map"></div>
  </section>

  <section class="reveal" aria-labelledby="h-flow">
    <h2 id="h-flow"><span class="ic" aria-hidden="true">🍻</span>当日の流れ</h2>
    <div id="flow"></div>
  </section>

  <section class="reveal" aria-labelledby="h-notes">
    <h2 id="h-notes"><span class="ic" aria-hidden="true">🎒</span>持ち物・注意事項</h2>
    <div id="notes"></div>
  </section>
  <p class="deadline" id="deadline"></p>
</main>

<div class="cta"><a id="cta" href="https://liff.line.me/2012697224-lfwPcqYm">アンケートに答える・直す</a></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycby45UwD6Ymwvnf_D_4vMbUGY_m0DUGJtse1oD3hqwHVuDASQ996Xnu2-AKLAqKheMiytQ/exec';
const PREVIEW = new URLSearchParams(location.search).has('preview');
const SAMPLE = {
  ok: true, attending: 12,
  event: {
    name: '年末だよ！みんなで忘年会', date: '12/20(土) 19:00〜', place: '居酒屋 のんき 渋谷店', address: '東京都渋谷区道玄坂1-2-3 のんきビル2F',
    fee: '4,000円（飲み放題つき）', mapUrl: '', deadline: '12/13(土)まで',
    schedule: '18:45 受付\n19:00 カンパイ！\n19:30 自己紹介タイム\n20:30 夢・目標シェア\n21:00 締め・集合写真',
    greeting: 'この会は、お酒を飲みながら「将来の夢」や「これからの働き方」を気軽に語り合う交流会です。希望する人には、主催者からお仕事の紹介もしています。',
    rules: '・セクハラ、パワハラ、しつこい勧誘・営業は禁止です\n・守れない場合は途中で退場していただき、次回以降も参加できません\n・お酒の席なので、20歳未満の方は参加できません',
    notes: '・会費は当日現金でお願いします\n・遅れる場合はLINEで連絡してね',
  },
};
const $ = (id) => document.getElementById(id);
const el = (tag, props, kids) => { const e = Object.assign(document.createElement(tag), props || {}); (kids || []).forEach((k) => e.append(k)); return e; };

Nomy.installCSS();
$('nomy').innerHTML = Nomy.svg({ id: 'ev', face: 'happy' });

function isSet(v) { return v && v !== '未定'; }

function render(d) {
  const ev = d.event;
  document.title = ev.name + '｜イベント詳細';
  $('name').textContent = ev.name;
  $('date').textContent = ev.date;
  $('placeTop').textContent = isSet(ev.place) ? '@ ' + ev.place : '';
  const num = el('b', { textContent: '0' });
  $('count').replaceChildren('いま', el('br'), num, ' 人が参加予定！');
  countUp(num, d.attending);
  $('greet').textContent = ev.greeting || '';
  $('rules').textContent = ev.rules || '';

  const facts = [['日時', ev.date], ['場所', ev.place], ['会費', ev.fee]];
  if (ev.deadline) facts.push(['回答の締切', ev.deadline]);
  $('facts').replaceChildren(...facts.flatMap(([k, v]) => [el('dt', { textContent: k }), el('dd', { textContent: v || '未定' })]));

  // 地図：住所（なければ店名）で埋め込み。Googleマップの共有リンクがあればボタンはそちらへ
  const q = ev.address || (isSet(ev.place) ? ev.place : '');
  const map = $('map');
  if (q) {
    const iframe = el('iframe', { title: ev.place + 'の地図', loading: 'lazy', referrerPolicy: 'no-referrer-when-downgrade',
      src: 'https://www.google.com/maps?q=' + encodeURIComponent(q) + '&output=embed' });
    const href = /^https:\/\//.test(ev.mapUrl) ? ev.mapUrl : 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(q);
    map.replaceChildren(iframe,
      el('div', { className: 'addr' }, [document.createTextNode(ev.place), el('small', { textContent: ev.address })]),
      el('a', { className: 'btn-map', href, target: '_blank', rel: 'noopener', textContent: 'Googleマップで開く' }));
  } else {
    map.replaceChildren(el('p', { className: 'addr empty', textContent: 'お店が決まったら、ここに地図が出ます。' }));
  }

  // 当日の流れ：「19:00 カンパイ」の形なら時刻と内容に分ける
  const lines = (ev.schedule || '').split('\n').map((s) => s.trim()).filter(Boolean);
  $('flow').replaceChildren(lines.length
    ? el('ol', { className: 'flow' }, lines.map((s) => {
        const m = s.match(/^(\d{1,2}[:：]\d{2})\s*[〜~-]?\s*(.*)$/);
        const li = el('li', {}, [el('span', { className: 't', textContent: m ? m[1].replace('：', ':') : '' }), el('span', { className: 'dot' }), el('span', { className: 'what', textContent: m ? m[2] : s })]);
        li.style.setProperty('--i', lines.indexOf(s));
        return li;
      }))
    : el('p', { className: 'empty', textContent: '当日の流れは、決まりしだいここに載せます。' }));

  $('notes').replaceChildren(ev.notes
    ? el('p', { className: 'notes', textContent: ev.notes })
    : el('p', { className: 'empty', textContent: '今のところ、特に持ち物はありません。' }));
  $('deadline').textContent = ev.deadline ? 'アンケートの締切：' + ev.deadline : '';
}

const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
function countUp(node, to) {
  if (REDUCED || !to) { node.textContent = to; return; }
  const t0 = performance.now() + 1300; // 吹き出しが出てから数える
  const step = (t) => { const p = Math.max(0, Math.min(1, (t - t0) / 900)); node.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

// スクロールで各セクションを表示
const io = 'IntersectionObserver' in window ? new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .15 }) : null;
document.querySelectorAll('.reveal').forEach((s) => io ? io.observe(s) : s.classList.add('in'));

// ノミィ：ページを開いたら手（泡）をふる
setTimeout(() => Nomy.play(document.querySelector('#nomy svg'), 'jump'), 1500);

async function load() {
  try {
    const d = PREVIEW ? SAMPLE : await (await fetch(GAS_URL + '?type=event')).json();
    if (!d.ok) throw new Error('bad');
    render(d);
  } catch (e) {
    $('name').textContent = 'イベント詳細';
    $('date').textContent = '読み込めませんでした';
    $('main').prepend(el('p', { className: 'err', textContent: 'イベント情報を読み込めませんでした。電波のいいところで、ページを開き直してください。' }));
  }
}
load();
</script>
</body>
</html>
